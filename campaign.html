<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon48.png" sizes="48x48" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="assets/css/loader.css" />
    <link rel="stylesheet" href="assets/css/print.css" media="print"/>

    <style>
      body {
        font-family: "Ubuntu", sans-serif;
        font-weight: 300;
        font-style: normal;
      }
    </style>

    <title id="page-title">Campagne - SMS Routeur</title>
  </head>

  <body>
    <div
      id="loader-block"
      class="h-100 justify-content-center align-items-center mt-3"
      style="display: none"
    >
      <div class="loader"></div>
    </div>
    <div
      id="content-block"
      class="mx-5 animate__animated animate__fadeIn"
      style="display: none"
    >
      <div
        class="d-flex justify-content-between align-items-center mt-3 d-print-none"
      >
        <span class="fs-1"
          ><a class="text-decoration-none text-dark" href="/"
            >SMS Routeur</a
          ></span
        >
        <div class="d-flex justify-content- align-items-center">
          <img
            id="profile-picture"
            src="/"
            alt="Profile picture"
            class="w-25 img-thumbnail rounded-circle me-1"
          />
          <button
            id="btn-logout"
            type="button"
            class="btn btn-link btn-sm fs-6 text-decoration-none text-secondary"
          >
            Se déconnecter
          </button>
        </div>
      </div>
      <div
        class="d-flex justify-content-between align-items-center flex-column m-auto mt-5 p-3"
      >
        <div
          class="w-100 mb-3 pb-3 d-flex justify-content-between align-items-center border-bottom"
        >
          <h2 id="campaign-name">{{campaign.name}}</h2>
          <button class="btn btn-md btn-primary" id="btn-launch-campaign">
            Lancer la campagne
          </button>
          <button class="btn btn-md btn-primary d-print-none" id="btn-print" onclick="window.print()">
            Imprimer
          </button>
        </div>
        <div class="w-100">
          <span class="fs-4">Détails de la campagne</span>
          <table class="table mt-2">
            <tbody>
              <tr>
                <td class="fw-bold w-25">Auteur</td>
                <td id="campaign-author">--</td>
              </tr>
              <tr>
                <td class="fw-bold">Date de création</td>
                <td id="campaign-createdAt">--</td>
              </tr>
              <tr>
                <td class="fw-bold">Date de démarrage</td>
                <td id="campaign-startedAt">--</td>
              </tr>
              <tr>
                <td class="fw-bold">Date de fin</td>
                <td id="campaign-endedAt">--</td>
              </tr>
              <tr>
                <td class="fw-bold">Statut</td>
                <td id="campaign-status">--</td>
              </tr>
              <tr>
                <td class="fw-bold">Nombre de destinataires</td>
                <td id="campaign-nb-recipients">--</td>
              </tr>
              <tr>
                <td class="fw-bold">Smartphone</td>
                <td id="campaign-device">--</td>
              </tr>
              <tr>
                <td class="fw-bold">Message</td>
                <td id="campaign-message">--</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="block-recipients" class="table-responsive w-100 pt-3">
          <span class="fs-4">Liste des destinataires</span
          ><span>
            &nbsp; (<span id="campaign-nb-recipients-table">--</span> au
            total)</span
          >
          <table
            id="table-recipients"
            class="table table-striped table-hover mt-3"
          >
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Nom</th>
                <th scope="col">Numéro</th>
                <th scope="col">Statut</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
    <script type="module">
      import { logout, getCurrentUser } from "./assets/js/db.js";
      import {
        onClick,
        setLoaderVisibility,
        setContentVisibility,
        goToHomePage,
      } from "./assets/js/utils.js";
      (() => {
        setLoaderVisibility(true);
        getCurrentUser((user) => {
          const profilePictureEl = document.getElementById("profile-picture");
          if (user) {
            profilePictureEl.src = user.photoURL;
            profilePictureEl.style.display = "inline";
            setLoaderVisibility(false);
            setContentVisibility(true);
          } else {
            // User is signed out
            goToHomePage();
          }
        });
        onClick("btn-logout", () => {
          setLoaderVisibility(true);
          setContentVisibility(false);
          logout(console.error);
        });
      })();
    </script>
    <script src="assets/js/campaign/db.js" type="module"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
  </body>
</html>
