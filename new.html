<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon48.png" sizes="48x48" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>

    <title>SMS Routeur - Nouvelle campagne</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="assets/css/loader.css" />
    <style>
      @media print {
        #content-block {
          width: 100% !important;
          max-width: 100% !important;
        }
      }
    </style>
  </head>

  <body class="animate__animated animate__fadeIn">
    <div
      id="loader-block"
      class="h-100 justify-content-center align-items-center mt-3"
      style="display: none"
    >
      <div class="loader"></div>
    </div>
    <div
      id="content-block"
      class="container animate__animated animate__fadeIn"
      style="display: none"
    >
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="fs-1"
          ><a class="text-decoration-none text-dark" href="/"
            >SMS Routeur</a
          ></span
        >
        <div class="d-flex justify-content- align-items-center">
          <img
            id="profile-picture"
            src="/"
            alt="Profile picture"
            class="w-25 img-thumbnail rounded-circle me-1"
          />
          <button
            id="btn-logout"
            type="button"
            class="btn btn-link btn-sm fs-6 text-decoration-none text-secondary"
          >
            Se déconnecter
          </button>
        </div>
      </div>
      <div
        class="d-flex justify-content-between align-items-center flex-column m-auto mt-5 p-3"
      >
        <form class="mb-5" id="form-new-campaign">
          <legend>Nouvelle campagne</legend>
          <div class="mb-3">
            <label for="text-campaign-name" class="form-label">
              🖉 Nom de la campagne
            </label>
            <input
              type="text"
              class="form-control"
              id="text-campaign-name"
              name="title"
              role="field"
            />
          </div>
          <div class="mb-3">
            <label for="text-campaign-message" class="form-label">
              📝 Message à envoyer
            </label>
            <textarea
              class="form-control"
              id="text-campaign-message"
              name="message"
              rows="3"
              role="field"
            ></textarea>
          </div>
          <div class="row align-items-end mb-3">
            <div class="col-sm-7">
              <label for="text-campaign-recipients" class="form-label">
                👥 Destinataires (séparés par des virgules)
              </label>
              <input
                type="text"
                class="form-control"
                id="text-campaign-recipients"
                name="recipients"
                role="field"
              />
            </div>
            <div class="col-sm mt-3">
              <button
                type="button"
                class="btn btn-primary"
                id="btn-import-recipients"
              >
                Importer des contacts
              </button>
            </div>
            <div id="recipientsHelp" class="form-text">
              Ex : 074211800, 074789222, 077147123, 077456777
            </div>
          </div>
          <div class="mb-3">
            <label for="select-campaign-device" class="form-label">
              📱 Smartphone à utiliser
            </label>
            <select
              class="form-select"
              aria-label="Default select example"
              id="select-campaign-device"
              name="device"
              role="field"
            ></select>
          </div>
          <button type="submit" class="btn btn-primary" id="btn-save">
            💾 Enregistrer la campagne
          </button>
        </form>
      </div>
    </div>
    <script src="assets/js/new/db.js" type="module"></script>
    <script type="module">
      import { logout, getCurrentUser } from "./assets/js/db.js";
      import {
        setLoaderVisibility,
        setContentVisibility,
        goToHomePage,
      } from "./assets/js/utils.js";
      (() => {
        setLoaderVisibility(true);
        getCurrentUser((user) => {
          const profilePictureEl = document.getElementById("profile-picture");
          if (user) {
            profilePictureEl.src = user.photoURL;
            profilePictureEl.style.display = "inline";
            setLoaderVisibility(false);
            setContentVisibility(true);
          } else {
            // User is signed out
            goToHomePage();
          }
        });
        document.getElementById("btn-logout").addEventListener("click", () => {
          setLoaderVisibility(true);
          setContentVisibility(false);
          logout(console.error);
        });
      })();
    </script>
    <script>
      const CLIENT_ID = "";
      const API_KEY = "";
      const SCOPES = "https://www.googleapis.com/auth/spreadsheets.readonly";

      let tokenClient;
      let accessToken;
      let pickerInited = false;
      let gisInited = false;
      let gapiInited = false;

      function gapiLoaded() {
        gapi.load("client", initializeGapiClient);
      }

      async function initializeGapiClient() {
        await gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: [
            "https://sheets.googleapis.com/$discovery/rest?version=v4",
          ],
        });
        gapiInited = true;
        maybeEnableButtons();
      }

      function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (tokenResponse) => {
            if (tokenResponse && tokenResponse.access_token) {
              accessToken = tokenResponse.access_token;
              createPicker();
            }
          },
        });
        gisInited = true;
        maybeEnableButtons();
      }

      function pickerCallback(data) {
        if (
          data[google.picker.Response.ACTION] == google.picker.Action.PICKED
        ) {
          const doc = data[google.picker.Response.DOCUMENTS][0];
          const fileId = doc[google.picker.Document.ID];
          const fileName = doc[google.picker.Document.NAME];
          console.log(doc);
          extractRecipients(fileId);
        }
      }

      function createPicker() {
        if (accessToken) {
          const picker = new google.picker.PickerBuilder()
            .addView(google.picker.ViewId.SPREADSHEETS)
            .setOAuthToken(accessToken)
            .setDeveloperKey(API_KEY)
            .setCallback(pickerCallback)
            .build();
          picker.setVisible(true);
        } else {
          tokenClient.requestAccessToken({ prompt: "" });
        }
      }

      function maybeEnableButtons() {
        if (gapiInited && gisInited && pickerInited) {
          document.getElementById("btn-import-recipients").disabled = false;
        }
      }

      async function extractRecipients(fileId) {
        const response = await gapi.client.sheets.spreadsheets.get({
          spreadsheetId: fileId,
        });

        if (!response.result) return;

        const sheet = response.result.sheets[0];
        const sheetName = sheet.properties.title;
        const range = `${sheetName}!A1:B`;

        gapi.client.sheets.spreadsheets.values
          .get({
            spreadsheetId: fileId,
            range: range,
          })
          .then(function (response) {
            const data = response.result.values;
            let recipients = [];
            for (let i = 0; i < data.length; i++) {
              // TODO Contaténer le nom du destinataire au numéro
              if (isValidNumber(data[i][0])) recipients.push(data[i][0]);
            }
            document.getElementById("text-campaign-recipients").value =
              recipients.join(", ");
          })
          .catch(console.log);
      }

      function isValidNumber(num) {
        // TODO Implémenter la validation des numéros
        return true;
      }

      document
        .getElementById("btn-import-recipients")
        .addEventListener("click", createPicker);

      function onApiLoad() {
        gapi.load("picker", () => {
          pickerInited = true;
          maybeEnableButtons();
        });
      }
    </script>
    <script
      async
      defer
      src="https://apis.google.com/js/api.js"
      onload="gapiLoaded()"
    ></script>
    <script
      async
      defer
      src="https://accounts.google.com/gsi/client"
      onload="gisLoaded()"
    ></script>
    <script
      async
      defer
      src="https://apis.google.com/js/api.js?onload=onApiLoad"
    ></script>
  </body>
</html>
